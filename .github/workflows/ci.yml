name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Pinned tool versions
        id: versions
        working-directory: ${{ github.workspace }}
        run: grep -E "^[A-Z_]+=" toolchain.env >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v${{ steps.versions.outputs.GOLANGCI_LINT_VERSION }}
          working-directory: backend
      # Thresholds live in the Makefile (GO_COVERAGE_MIN). Job name stays `backend`.
      - name: Test and coverage
        working-directory: ${{ github.workspace }}
        run: make cover-backend
      - name: sqlc generated code is committed
        working-directory: ${{ github.workspace }}
        run: |
          make generate
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "make generate changed the tree:"
            echo "$dirty"
            git diff
            exit 1
          fi
      - name: govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      # Thresholds live in the Makefile (FE_COVERAGE_MIN). Job name stays `frontend`.
      - name: Test and coverage
        working-directory: ${{ github.workspace }}
        run: make cover-frontend
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: End-to-end tests
        run: make e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: backend, file: backend/Dockerfile }
          - { name: web, context: ., file: deploy/env/web.Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
